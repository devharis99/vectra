[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectra"
version = "1.0.0"
description = "Vectra: High-Performance Local CVE & GTFOBins Intelligence Search Engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]

[project.scripts]
vectra = "vectra.cli:main"
cve = "vectra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vectra*"]
